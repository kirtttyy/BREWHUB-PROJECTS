<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · BrewHub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a class="brand" href="index.html"><span class="brand-mark" id="brandIcon"></span>BrewHub</a>
      <h1>Welcome back</h1>
      <p class="sub" id="loginSub">Sign in with your phone number to continue.</p>
      <div id="notice" class="demo-box hidden" style="color:var(--foreground)"></div>

      <form id="loginForm" class="stack">
        <div class="field">
          <label for="phone">Phone number</label>
          <input class="input" id="phone" type="tel" inputmode="numeric" placeholder="0917 123 4567" maxlength="13" required autocomplete="tel" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" placeholder="Password" required autocomplete="current-password" />
        </div>
        <div id="error" class="error-box hidden"></div>
        <button class="btn btn-primary btn-lg w-full" type="submit">Sign in</button>
      </form>
      <p class="text-center text-sm muted mt-3">
        New here? <a href="register.html" style="font-weight:600;color:var(--primary)">Create an account</a>
      </p>
      <p class="text-center text-sm muted mt-2"><a href="index.html">Back to home</a></p>
    </div>
  </div>

  <script src="models/db.js"></script>
  <script src="utils/ui.js"></script>
  <script src="controllers/auth.js"></script>
  <script>
    async function boot() {
      await BH.init()
      UI.guestOnly()
      document.getElementById('brandIcon').innerHTML = UI.svg('coffee')

      if (UI.qs('registered') === 'store') {
        const notice = document.getElementById('notice')
        notice.classList.remove('hidden')
        notice.innerHTML = '<strong>Store registered.</strong> Sign in with your phone and password. Admin still needs to approve your shop before customers can see it.'
        document.getElementById('loginSub').textContent = 'Sign in to open your cashier dashboard.'
      }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault()
        const error = document.getElementById('error')
        try {
          await AuthController.login(document.getElementById('phone').value, document.getElementById('password').value)
        } catch (err) {
          error.textContent = err.message
          error.classList.remove('hidden')
        }
      })
    }
    boot()
  </script>
</body>
</html>
