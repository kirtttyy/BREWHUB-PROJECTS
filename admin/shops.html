<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shops · Admin · BrewHub</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="cashier-layout">
    <div id="sidebar"></div>
    <main class="cashier-main" id="root"></main>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    async function boot() {
      await BH.init()
      const user = UI.requireUser(['admin'])
      if (!user) return
      document.getElementById('sidebar').innerHTML = UI.adminSidebar('shops')
      document.getElementById('signOutBtn').onclick = () => { BH.signOut(); location.href = '../index.html' }

      const filter = UI.qs('status') || 'all'
      const shops = [...BH.db.stores].sort((a, b) => {
        const rank = { pending: 0, approved: 1, suspended: 2 }
        return (rank[a.status] ?? 9) - (rank[b.status] ?? 9) || a.name.localeCompare(b.name)
      })
      const visible = filter === 'all' ? shops : shops.filter((s) => s.status === filter)

      const chip = (id, label) =>
        `<a class="chip ${filter === id ? 'active' : ''}" href="?status=${id}">${label}</a>`

      document.getElementById('root').innerHTML = `
        <div class="cashier-top">
          <div>
            <h1 class="font-serif" style="margin:0;font-size:clamp(1.7rem,3vw,2.1rem)">Coffee shops</h1>
            <p class="muted text-sm" style="margin:.35rem 0 0">Approve new shops or suspend ones that shouldn’t stay live.</p>
          </div>
        </div>

        <div class="admin-filters">
          ${chip('all', `All (${shops.length})`)}
          ${chip('pending', `Pending (${shops.filter((s) => s.status === 'pending').length})`)}
          ${chip('approved', `Approved (${shops.filter((s) => s.status === 'approved').length})`)}
          ${chip('suspended', `Suspended (${shops.filter((s) => s.status === 'suspended').length})`)}
        </div>

        <div class="admin-panel">
          ${visible.length === 0
            ? `<p class="muted text-sm admin-empty">No shops in this filter.</p>`
            : visible.map((s) => {
                const items = BH.productsOf(s.id).length
                return `
                  <div class="admin-row shops">
                    <img class="admin-thumb" src="${s.image}" alt="" />
                    <div>
                      <div class="font-bold">${s.name}</div>
                      <div class="text-sm muted">${s.area} · ${BH.ownerName(s.ownerId)} · ${items} menu items</div>
                    </div>
                    <div class="text-sm muted">${s.address}<br/>${UI.time12(s.openTime)} – ${UI.time12(s.closeTime)}</div>
                    <span class="badge badge-${s.status}">${s.status}</span>
                    <div class="admin-actions">
                      ${s.status !== 'approved' ? `<button class="btn btn-primary btn-sm" data-status="${s.id}" data-to="approved">Approve</button>` : ''}
                      ${s.status !== 'pending' ? `<button class="btn btn-outline btn-sm" data-status="${s.id}" data-to="pending">Set pending</button>` : ''}
                      ${s.status !== 'suspended' ? `<button class="btn btn-outline btn-sm" data-status="${s.id}" data-to="suspended">Suspend</button>` : ''}
                    </div>
                  </div>
                `
              }).join('')}
        </div>
      `

      document.querySelectorAll('[data-status]').forEach((btn) => {
        btn.onclick = () => {
          const to = btn.dataset.to
          BH.setStoreStatus(btn.dataset.status, to)
          UI.toast(to === 'approved' ? 'Shop is now live.' : to === 'suspended' ? 'Shop suspended.' : 'Shop set back to pending.')
          boot()
        }
      })
    }
    boot()
  </script>
</body>
</html>
