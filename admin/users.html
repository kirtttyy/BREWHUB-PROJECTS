<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Users · Admin · BrewHub</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="cashier-layout">
    <div id="sidebar"></div>
    <main class="cashier-main" id="root"></main>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    async function boot() {
      await BH.init()
      const user = UI.requireUser(['admin'])
      if (!user) return
      document.getElementById('sidebar').innerHTML = UI.adminSidebar('users')
      document.getElementById('signOutBtn').onclick = () => { BH.signOut(); location.href = '../index.html' }

      const roleLabel = { admin: 'Admin', store_owner: 'Cashier', customer: 'Customer' }
      const users = [...BH.db.users].sort((a, b) => a.role.localeCompare(b.role) || a.name.localeCompare(b.name))

      document.getElementById('root').innerHTML = `
        <div class="cashier-top">
          <div>
            <h1 class="font-serif" style="margin:0;font-size:2rem">Users</h1>
            <p class="muted text-sm" style="margin:.2rem 0 0">${users.length} accounts on the platform.</p>
          </div>
        </div>

        <div class="card" style="padding:0;overflow:hidden">
          ${users.map((u) => {
            const shops = BH.db.stores.filter((s) => s.ownerId === u.id)
            const extra = u.role === 'store_owner'
              ? (shops.length ? shops.map((s) => s.name).join(', ') : 'No shop yet')
              : u.role === 'customer'
                ? `${BH.db.orders.filter((o) => o.customerId === u.id).length} orders`
                : 'Platform access'
            return `
              <div class="admin-row users">
                <div>
                  <div class="font-bold">${u.name}</div>
                  <div class="text-sm muted">${u.phone || '—'}</div>
                </div>
                <div class="text-sm">${u.email}</div>
                <span class="badge badge-soft">${roleLabel[u.role] || u.role}</span>
                <div class="text-sm muted">${extra}</div>
              </div>
            `
          }).join('')}
        </div>
      `
    }
    boot()
  </script>
</body>
</html>
