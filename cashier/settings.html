<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings · Cashier</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="cashier-layout">
    <div id="sidebar"></div>
    <main class="cashier-main" id="root"></main>
  </div>

  <script src="../models/db.js"></script>
  <script src="../utils/ui.js"></script>
  <script>
    async function boot() {
      await BH.init()
      const user = UI.requireUser(['store_owner'])
      if (!user) return
      const store = BH.storeOfOwner(user.id)
      document.getElementById('sidebar').innerHTML = UI.cashierSidebar('settings')
      document.getElementById('signOutBtn').onclick = () => { BH.signOut(); location.href = '../index.html' }

      if (!store) {
        document.getElementById('root').innerHTML = `<div class="card" style="padding:1.25rem"><p class="muted">No shop linked to this account.</p></div>`
        return
      }

      document.getElementById('root').innerHTML = `
        <div class="cashier-top">
          <div>
            <h1 class="font-serif" style="margin:0;font-size:2rem">Shop settings</h1>
            <p class="muted text-sm" style="margin:.2rem 0 0">Status: ${store.status}</p>
          </div>
        </div>

        ${store.status === 'approved' ? `
        <div class="open-toggle ${store.acceptingOrders ? 'on' : 'off'} mb-4">
          <div>
            <div class="font-bold">Your shop is ${store.acceptingOrders ? 'Open' : 'Closed'}</div>
            <div class="text-xs muted">${store.acceptingOrders
              ? 'Customers can see your shop and order. Switch off when you close.'
              : 'Customers see your shop as Closed and can’t open it or order.'}</div>
          </div>
          <button class="switch ${store.acceptingOrders ? 'on' : ''}" id="toggle"></button>
        </div>` : `
        <div class="card mb-4" style="padding:1rem">
          <div class="font-bold">Waiting for admin approval</div>
          <div class="text-sm muted">You can manage products while pending. Open/Closed unlocks after approval.</div>
        </div>`}

        <div class="card" style="padding:1.2rem">
          <div class="stack">
            <div class="field"><label>Shop name</label><input class="input" value="${store.name}" disabled /></div>
            <div class="field"><label>Street address</label><input class="input" value="${store.address}" disabled /></div>
            <div class="field"><label>Area</label><input class="input" value="${store.area}" disabled /></div>
            <div class="flex gap-2">
              <div class="field" style="flex:1"><label>Opens at</label><input class="input" value="${store.openTime}" disabled /></div>
              <div class="field" style="flex:1"><label>Closes at</label><input class="input" value="${store.closeTime}" disabled /></div>
            </div>
          </div>
        </div>
      `

      const toggle = document.getElementById('toggle')
      if (toggle) {
        toggle.onclick = () => {
          try {
            const next = !store.acceptingOrders
            BH.setAccepting(store.id, next)
            UI.toast(next ? 'Your shop is now Open.' : 'Your shop is now Closed.')
            boot()
          } catch (err) {
            UI.toast(err.message)
          }
        }
      }
    }
    boot()
  </script>
</body>
</html>
