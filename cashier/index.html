<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cashier · BrewHub</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="cashier-layout">
    <div id="sidebar"></div>
    <main class="cashier-main" id="root"></main>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    async function boot() {
      await BH.init()
      const user = UI.requireUser(['store_owner'])
      if (!user) return
      const store = BH.storeOfOwner(user.id)
      document.getElementById('sidebar').innerHTML = UI.cashierSidebar('home')
      document.getElementById('signOutBtn').onclick = () => { BH.signOut(); location.href = '../index.html' }

      const orders = BH.db.orders.filter((o) => o.storeId === store.id)
      const waiting = orders.filter((o) => BH.effectiveStatus(o) === 'waiting_payment').length
      const preparing = orders.filter((o) => o.status === 'preparing').length
      const ready = orders.filter((o) => o.status === 'ready').length
      const claimedToday = orders.filter((o) => o.status === 'claimed' && o.claimedAt && new Date(o.claimedAt).toDateString() === new Date().toDateString()).length

      document.getElementById('root').innerHTML = `
        <div class="cashier-top">
          <div>
            <h1 class="font-serif" style="margin:0;font-size:2rem">${store.name}</h1>
            <p class="muted text-sm" style="margin:.2rem 0 0">Cashier dashboard</p>
          </div>
          <a class="btn btn-primary" href="scan.html">${UI.svg('scan')} Scan QR</a>
        </div>

        <div class="open-toggle ${store.acceptingOrders ? 'on' : 'off'} mb-4">
          <div>
            <div class="font-bold">Shop is ${store.acceptingOrders ? 'Open' : 'Closed'}</div>
            <div class="text-xs muted">${store.acceptingOrders ? 'Customers can open your shop and order.' : 'Customers see you as Closed and can’t open your shop.'}</div>
          </div>
          <button class="switch ${store.acceptingOrders ? 'on' : ''}" id="toggle" aria-label="Open or closed"></button>
        </div>

        <div class="stat-grid mb-4">
          <div class="stat"><div class="label">Waiting to pay</div><div class="value">${waiting}</div></div>
          <div class="stat"><div class="label">Preparing</div><div class="value">${preparing}</div></div>
          <div class="stat"><div class="label">Ready</div><div class="value">${ready}</div></div>
          <div class="stat"><div class="label">Claimed today</div><div class="value">${claimedToday}</div></div>
        </div>

        <a class="card" style="display:flex;justify-content:space-between;align-items:center;padding:1.1rem" href="scan.html">
          <div>
            <div class="font-bold">Scan a customer QR</div>
            <div class="text-sm muted">Type the code if the camera isn’t available.</div>
          </div>
          <span>${UI.svg('arrow')}</span>
        </a>
      `

      document.getElementById('toggle').onclick = () => {
        const next = !store.acceptingOrders
        BH.setAccepting(store.id, next)
        UI.toast(next ? 'Your shop is now Open.' : 'Your shop is now Closed.')
        boot()
      }
    }
    boot()
  </script>
</body>
</html>
