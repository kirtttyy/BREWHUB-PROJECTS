<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan · BrewHub</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="cashier-layout">
    <div id="sidebar"></div>
    <main class="cashier-main">
      <div class="cashier-top">
        <div>
          <h1 class="font-serif" style="margin:0;font-size:2rem">Scan QR</h1>
          <p class="muted text-sm" style="margin:.2rem 0 0">Scan or type the customer’s order code.</p>
        </div>
      </div>
      <div class="scan-panel">
        <div class="field">
          <label for="code">Order code</label>
          <input class="input" id="code" placeholder="Order or voucher code" autocomplete="off" />
        </div>
        <div class="flex gap-2 mt-3">
          <button class="btn btn-primary" id="lookup">Find order</button>
          <button class="btn btn-outline" id="clear">Clear</button>
        </div>
        <p class="text-xs muted mt-2">Tip: customer QR values look like BREWHUB:BH-4821</p>
      </div>
      <div id="result"></div>
    </main>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    let user, store, current = null

    async function boot() {
      await BH.init()
      user = UI.requireUser(['store_owner'])
      if (!user) return
      store = BH.storeOfOwner(user.id)
      document.getElementById('sidebar').innerHTML = UI.cashierSidebar('scan')
      document.getElementById('signOutBtn').onclick = () => { BH.signOut(); location.href = '../index.html' }

      const preset = UI.qs('code')
      if (preset) {
        document.getElementById('code').value = preset
        lookup()
      }

      document.getElementById('lookup').onclick = lookup
      document.getElementById('clear').onclick = () => {
        document.getElementById('code').value = ''
        document.getElementById('result').innerHTML = ''
        current = null
      }
      document.getElementById('code').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') lookup()
      })
    }

    function lookup() {
      const raw = document.getElementById('code').value
      const order = BH.findOrder(raw)
      if (!order) {
        document.getElementById('result').innerHTML = `<div class="order-panel error-box">We couldn’t find that order code.</div>`
        return
      }
      if (order.storeId !== store.id) {
        document.getElementById('result').innerHTML = `<div class="order-panel error-box">That order belongs to another shop.</div>`
        return
      }
      current = order
      drawOrder()
    }

    function drawOrder() {
      const order = BH.db.orders.find((o) => o.id === current.id)
      const status = BH.effectiveStatus(order)
      document.getElementById('result').innerHTML = `
        <div class="order-panel">
          <div class="flex-between mb-3">
            <div>
              <div class="code-big" style="font-size:1.4rem;margin:0">${order.code}</div>
              <div class="text-sm muted">${order.customerName}</div>
            </div>
            <span class="status-pill status-${status}">${UI.statusLabel(status)}</span>
          </div>
          ${order.queueNumber ? `<p class="badge badge-soft mb-2">Queue #${order.queueNumber}</p>` : ''}
          ${order.items.map((i) => `
            <div class="flex-between text-sm" style="padding:.35rem 0;border-bottom:1px solid var(--border)">
              <span>${i.quantity}× ${i.name}${i.size ? ` · ${i.size}` : ''}${i.addOns?.length ? ` · ${i.addOns.join(', ')}` : ''}</span>
              <span>${UI.peso(i.price * i.quantity)}</span>
            </div>`).join('')}
          <div class="flex-between font-bold mt-3"><span>Total due</span><span>${UI.peso(order.total)}</span></div>
          ${order.discount ? `<p class="text-xs muted">Includes ${UI.peso(order.discount)} discount (${order.promoLabel || 'promo'})</p>` : ''}
          <div class="flex gap-2 mt-4" style="flex-wrap:wrap">
            ${status === 'waiting_payment' ? `
              <button class="btn btn-primary" data-to="preparing" data-pay="cash">Mark paid · Cash</button>
              <button class="btn btn-outline" data-to="preparing" data-pay="gcash">Mark paid · GCash</button>
              <button class="btn btn-ghost" data-to="cancelled" style="color:var(--destructive)">Cancel</button>` : ''}
            ${status === 'preparing' ? `<button class="btn btn-primary" data-to="ready">Mark ready</button>` : ''}
            ${status === 'ready' ? `<button class="btn btn-primary" data-to="claimed">Mark claimed</button>` : ''}
          </div>
        </div>`

      document.querySelectorAll('#result [data-to]').forEach((b) => b.addEventListener('click', () => {
        try {
          BH.advanceOrder(store.id, order.id, b.dataset.to, b.dataset.pay || 'cash')
          UI.toast(b.dataset.to === 'preparing' ? 'Paid! Order is preparing.' : b.dataset.to === 'ready' ? 'Order is ready.' : b.dataset.to === 'claimed' ? 'Order claimed.' : 'Order cancelled.')
          drawOrder()
        } catch (err) {
          UI.toast(err.message)
          drawOrder()
        }
      }))
    }

    boot()
  </script>
</body>
</html>
