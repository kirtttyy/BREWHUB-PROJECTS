<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shops · BrewHub</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="app-top">
    <div class="app-top-inner">
      <div id="brand"></div>
      <div style="margin-left:auto" class="text-sm muted" id="hello"></div>
    </div>
  </header>

  <main class="page-pad">
    <div class="container">
      <h1 class="font-serif" style="font-size:2rem;margin:0 0 .35rem">Coffee shops</h1>
      <p class="muted mb-3">Order ahead, then pay at the counter.</p>
      <div class="filters" id="filters"></div>
      <div class="shop-grid" id="shopsGrid"></div>
    </div>
  </main>
  <div id="nav"></div>

  <script src="../models/db.js"></script>
  <script src="../utils/ui.js"></script>
  <script>
    let openOnly = false
    async function boot() {
      await BH.init()
      const user = UI.requireUser(['customer'])
      if (!user) return
      document.getElementById('brand').innerHTML = UI.brandHtml()
      document.getElementById('hello').textContent = `Hi, ${user.name.split(' ')[0]}`
      document.getElementById('nav').innerHTML = UI.customerNav('stores')
      render()
    }

    function render() {
      document.getElementById('filters').innerHTML = `
        <button class="chip ${!openOnly ? 'active' : ''}" data-f="all">All shops</button>
        <button class="chip ${openOnly ? 'active' : ''}" data-f="open">Open now</button>
      `
      document.querySelectorAll('#filters .chip').forEach((b) => b.addEventListener('click', () => {
        openOnly = b.dataset.f === 'open'
        render()
      }))

      let shops = BH.approvedStores().sort((a, b) => Number(b.acceptingOrders) - Number(a.acceptingOrders) || b.rating - a.rating)
      if (openOnly) shops = shops.filter((s) => s.acceptingOrders)

      document.getElementById('shopsGrid').innerHTML = shops.map((s) => {
        const open = s.acceptingOrders
        const count = BH.productsOf(s.id).length
        return `
          <${open ? 'a' : 'div'} class="shop-card ${open ? 'open' : 'closed'}" ${open ? `href="menu.html?store=${s.id}"` : ''}>
            <div class="cover">
              <img src="${BH.mediaUrl(s.image)}" alt="${s.name}" />
              ${open
                ? `<span class="badge badge-open" style="position:absolute;left:.75rem;top:.75rem">● Open</span>`
                : `<div class="closed-overlay"><strong>Closed</strong><span class="text-xs">Unavailable right now</span></div>`}
            </div>
            <div class="shop-body">
              <div class="flex-between"><h3>${s.name}</h3>
                ${s.rating ? `<span class="text-sm font-bold" style="color:#d97706">★ ${s.rating.toFixed(1)}</span>` : ''}
              </div>
              <p class="text-sm muted" style="margin:0">${s.description}</p>
              <div class="shop-meta">
                <span>${s.address}</span>
                <span>${UI.time12(s.openTime)} – ${UI.time12(s.closeTime)}</span>
              </div>
              <div class="shop-foot">
                <span class="muted">${count} items</span>
                <span class="cta">${open ? 'See menu →' : `Opens at ${UI.time12(s.openTime)}`}</span>
              </div>
            </div>
          </${open ? 'a' : 'div'}>
        `
      }).join('')
    }
    boot()
  </script>
</body>
</html>
