<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Me · BrewHub</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="app-top"><div class="app-top-inner"><div id="brand"></div></div></header>
  <main class="page-pad"><div class="container-sm" id="root"></div></main>
  <div id="nav"></div>

  <script src="../models/db.js"></script>
  <script src="../utils/ui.js"></script>
  <script>
    async function boot() {
      await BH.init()
      const user = UI.requireUser(['customer'])
      if (!user) return
      document.getElementById('brand').innerHTML = UI.brandHtml()
      document.getElementById('nav').innerHTML = UI.customerNav('me')

      document.getElementById('root').innerHTML = `
        <div class="card" style="padding:1.25rem;background:linear-gradient(135deg,var(--primary),#6b4423);color:white;border:0">
          <p class="text-sm" style="opacity:.85;margin:0">Signed in as</p>
          <h1 class="font-serif" style="margin:.2rem 0 .35rem;font-size:1.8rem">${user.name}</h1>
          <p class="text-sm" style="opacity:.85;margin:0">${user.phone || ''}${user.address ? ` · ${user.address}` : ''}</p>
        </div>
        <div class="card" style="padding:0;margin-top:1rem;overflow:hidden">
          <a href="orders.html" style="display:block;padding:1rem;border-bottom:1px solid var(--border)">My orders</a>
          <a href="stores.html" style="display:block;padding:1rem;border-bottom:1px solid var(--border)">Browse shops</a>
          <button id="out" style="display:block;width:100%;text-align:left;padding:1rem;border:0;background:transparent;color:var(--destructive);cursor:pointer;font-weight:700">Sign out</button>
        </div>
      `
      document.getElementById('out').onclick = () => { BH.signOut(); location.href = '../index.html' }
    }
    boot()
  </script>
</body>
</html>
